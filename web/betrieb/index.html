<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Uncle Laundry – Betrieb</title>
<style>
  :root {
    --indigo: #1c2b5a;
    --ink: #16223f;
    --paper: #f5f8fd;
    --white: #ffffff;
    --sky: #dce7f7;
    --line: #bccbe3;
    --tag: #f4c84a;
    --muted: #4f5d7a;
    --danger: #b3261e;
    --ok: #1e6b2f;
    --focus: #0b57d0;
    --slab: Rockwell, "Rockwell Nova", "Roboto Slab", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.5 var(--sans);
    padding-bottom: 60px;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .ticking { height: 10px; background: repeating-linear-gradient(90deg, var(--indigo) 0 10px, var(--white) 10px 20px); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
  .brand { font: 700 1.15rem var(--slab); color: var(--indigo); }
  .brand .tag { color: var(--muted); font: 400 .95rem var(--sans); }

  input, select, textarea, button { font: inherit; color: var(--ink); }
  input {
    width: 100%; min-height: 46px; padding: 10px 14px;
    background: var(--white); border: 1.5px solid var(--line); border-radius: 6px;
  }
  label { display: block; margin: 0 0 6px; font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 16px;
    font-weight: 600; border: 2px solid var(--indigo); border-radius: 6px;
    cursor: pointer; background: var(--white); color: var(--indigo);
  }
  .btn.primary { background: var(--indigo); color: var(--white); }
  .btn.primary:hover { background: #26397a; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.plain { border-color: transparent; background: transparent; text-decoration: underline; }

  .login-card {
    max-width: 420px; margin: 60px auto; padding: 28px 26px;
    background: var(--white); border: 1.5px solid var(--indigo); border-radius: 10px;
  }
  .login-card h1 { margin: 0 0 6px; font: 700 1.4rem var(--slab); color: var(--indigo); }
  .login-card p.lead { margin: 0 0 20px; color: var(--muted); }
  .login-card form { display: grid; gap: 14px; }
  .msg { margin: 0; font-size: .95rem; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--ok); }

  .kein-zugriff { max-width: 420px; margin: 60px auto; padding: 24px; text-align: center; color: var(--muted); }

  .filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 20px; }
  .filter button {
    padding: 8px 14px; border-radius: 999px;
    border: 1.5px solid var(--indigo); background: var(--white); color: var(--indigo);
    font-weight: 600; font-size: .92rem; cursor: pointer;
  }
  .filter button.on { background: var(--indigo); color: var(--white); }
  .filter .count { opacity: .8; font-weight: 400; }

  .leer { padding: 40px 0; text-align: center; color: var(--muted); }

  .order-list { display: grid; gap: 16px; }
  .order {
    background: var(--white); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 18px 20px;
  }
  .order-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  .order-head h2 { margin: 0; font: 700 1.1rem var(--slab); color: var(--indigo); }
  .order-erstellt { color: var(--muted); font-size: .88rem; }

  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    font-size: .82rem; font-weight: 700;
    background: var(--sky); color: var(--indigo);
  }
  .badge.neu { background: var(--tag); color: var(--ink); }
  .badge.zurueckgebracht { background: #dcefdd; color: var(--ok); }

  .order-grid { display: grid; gap: 14px; margin-top: 14px; }
  @media (min-width: 720px) { .order-grid { grid-template-columns: 1fr 1fr; } }
  .order-grid h3 { margin: 0 0 6px; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .order-grid p { margin: 0 0 2px; }
  .order-grid ul { margin: 0; padding-left: 18px; }
  .order-grid .preis { font-weight: 700; }

  .foto-link img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; border: 1.5px solid var(--line); }

  .status-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1.5px dashed var(--line); }
  .status-zeile select { min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--indigo); border-radius: 6px; background: var(--white); }

  .abrechnung-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1.5px dashed var(--line); }
  .abrechnung-zeile input {
    width: 100px; min-height: 40px; padding: 6px 10px;
    border: 1.5px solid var(--indigo); border-radius: 6px; background: var(--white);
  }
  .badge.bezahlt { background: #dcefdd; color: var(--ok); }
  .badge.nicht-bezahlt { background: var(--sky); color: var(--indigo); }
  .status-speichern { font-size: .88rem; color: var(--muted); }

  .site-foot { padding: 30px 0; text-align: center; color: var(--muted); font-size: .88rem; }
</style>
</head>
<body>
<div class="ticking" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">Uncle Laundry <span class="tag">· Betrieb</span></div>
    <button type="button" class="btn plain" id="btn-logout" hidden>Abmelden</button>
  </header>

  <div id="lade-anzeige">Einen Moment …</div>

  <div class="login-card" id="login-bereich" hidden>
    <h1>Anmelden</h1>
    <p class="lead">Nur für Mitarbeiter von Uncle Laundry.</p>
    <form id="form-login" novalidate>
      <div>
        <label for="login-email">E-Mail</label>
        <input id="login-email" type="email" autocomplete="email" required>
      </div>
      <div>
        <label for="login-pw">Passwort</label>
        <input id="login-pw" type="password" autocomplete="current-password" required>
      </div>
      <p class="msg err" id="login-msg" hidden></p>
      <button type="submit" class="btn primary" id="btn-login">Anmelden</button>
    </form>
  </div>

  <div class="kein-zugriff" id="kein-zugriff-bereich" hidden>
    <p>Dieses Konto hat keinen Zugriff auf die Betriebs-Ansicht.</p>
    <button type="button" class="btn" id="btn-logout-2">Abmelden</button>
  </div>

  <main id="haupt-bereich" hidden>
    <div class="filter" id="filter" role="tablist" aria-label="Nach Status filtern"></div>
    <div id="bestell-liste"></div>
  </main>

  <footer class="site-foot">Nur für den internen Gebrauch.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
"use strict";

if (typeof CONFIG === "undefined") {
  document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">Die Datei config.js fehlt. Sie muss im selben Ordner liegen wie index.html.</p>';
  throw new Error("config.js fehlt");
}

const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eurFmt = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
const eur = cents => eurFmt.format((cents || 0) / 100);
const datumFmt = iso => new Date(iso).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
const zeitpunktFmt = iso => new Date(iso).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

const STATUS = [
  { id: "neu",              label: "Neu" },
  { id: "abgeholt",         label: "Abgeholt" },
  { id: "in_bearbeitung",   label: "In Bearbeitung" },
  { id: "bereit",           label: "Bereit zur Rückgabe" },
  { id: "zurueckgebracht",  label: "Zurückgebracht" }
];
const statusLabel = id => (STATUS.find(s => s.id === id) || {}).label || id;

let aktuellerFilter = "neu";
let bestellungen = [];

function meldungZeigen(id, text) {
  const el = $("#" + id);
  el.textContent = text;
  el.hidden = !text;
}

/* ---------- Login ---------- */
function initLogin() {
  $("#form-login").addEventListener("submit", async e => {
    e.preventDefault();
    meldungZeigen("login-msg", "");
    const btn = $("#btn-login");
    btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({
      email: $("#login-email").value.trim(),
      password: $("#login-pw").value
    });
    btn.disabled = false;
    if (error) meldungZeigen("login-msg", "Anmeldung fehlgeschlagen. Bitte prüfe E-Mail und Passwort.");
  });

  $("#btn-logout").addEventListener("click", () => sb.auth.signOut());
  $("#btn-logout-2").addEventListener("click", () => sb.auth.signOut());
}

/* ---------- Nach Login: Zugriff prüfen und Ansicht umschalten ---------- */
async function anmeldungAendern(session) {
  $("#lade-anzeige").hidden = true;

  if (!session) {
    $("#login-bereich").hidden = false;
    $("#kein-zugriff-bereich").hidden = true;
    $("#haupt-bereich").hidden = true;
    $("#btn-logout").hidden = true;
    return;
  }

  const { data: profil } = await sb
    .from("profiles")
    .select("ist_mitarbeiter")
    .eq("id", session.user.id)
    .maybeSingle();

  $("#btn-logout").hidden = false;

  if (!profil || !profil.ist_mitarbeiter) {
    $("#login-bereich").hidden = true;
    $("#kein-zugriff-bereich").hidden = false;
    $("#haupt-bereich").hidden = true;
    return;
  }

  $("#login-bereich").hidden = true;
  $("#kein-zugriff-bereich").hidden = true;
  $("#haupt-bereich").hidden = false;
  await bestellungenLaden();
}

/* ---------- Bestellungen laden und anzeigen ---------- */
async function bestellungenLaden() {
  $("#bestell-liste").innerHTML = '<p class="leer">Bestellungen werden geladen …</p>';
  const { data, error } = await sb
    .from("bestellungen")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    $("#bestell-liste").innerHTML = '<p class="leer">Bestellungen konnten nicht geladen werden.</p>';
    return;
  }
  bestellungen = data || [];
  filterAnzeigen();
  listeRendern();
}

function filterAnzeigen() {
  const zaehlen = id => id === "alle" ? bestellungen.length : bestellungen.filter(b => b.status === id).length;
  const optionen = [{ id: "alle", label: "Alle" }, ...STATUS];
  $("#filter").innerHTML = optionen.map(o => `
    <button type="button" data-filter="${o.id}" class="${o.id === aktuellerFilter ? "on" : ""}">
      ${esc(o.label)} <span class="count">(${zaehlen(o.id)})</span>
    </button>`).join("");
  $("#filter").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    aktuellerFilter = b.dataset.filter;
    filterAnzeigen();
    listeRendern();
  }));
}

function saeckeText(b) {
  const s = Array.isArray(b.saecke) ? b.saecke : [];
  if (!s.length) return "";
  return "<ul>" + s.map(x => `<li>${x.anzahl} × ${esc(x.name)} <small>(bis ${x.max_kg} kg)</small></li>`).join("") + "</ul>";
}
function betragBerechnen(b, gewichtKg) {
  const hatSack = Array.isArray(b.saecke) && b.saecke.length > 0;

  // Ohne Sack gibt es nichts nachzuwiegen: Der ursprüngliche Höchstbetrag
  // ist bei reiner Spezialwäsche bereits der exakte Endbetrag (inklusive
  // eines eventuellen Aufschlags bis zum Mindestbestellwert).
  if (!hatSack) return b.hoechstbetrag_cent;

  const spezialSumme = (Array.isArray(b.spezialwaesche) ? b.spezialwaesche : [])
    .reduce((a, x) => a + (x.summe_cent || 0), 0);

  const sackBetrag = Math.max(Math.round(gewichtKg * (b.preis_pro_kg_cent || 0)), b.mindestbetrag_cent || 0);

  const zwischensumme = sackBetrag + (b.abholgebuehr_cent || 0) + spezialSumme;
  const rabatt = b.rabatt_prozent ? Math.round(zwischensumme * b.rabatt_prozent / 100) : 0;
  const betrag = zwischensumme - rabatt;

  return Math.min(betrag, b.hoechstbetrag_cent);
}

function spezialText(b) {
  const s = Array.isArray(b.spezialwaesche) ? b.spezialwaesche : [];
  if (!s.length) return "";
  return "<ul>" + s.map(x => `<li>${x.anzahl} × ${esc(x.name)}</li>`).join("") + "</ul>";
}

function abrechnungHtml(b) {
  if (b.bezahlt) return "";
  if (!b.stripe_payment_intent_id) {
    return `<div class="abrechnung-zeile"><span class="status-speichern">Keine Zahlung zu dieser Bestellung hinterlegt.</span></div>`;
  }
  const hatSack = Array.isArray(b.saecke) && b.saecke.length > 0;
  return `
    <div class="abrechnung-zeile">
      ${hatSack ? `
        <label for="gewicht-${b.id}" style="margin:0">Gewicht (kg)</label>
        <input type="number" id="gewicht-${b.id}" min="0.1" max="${b.hoechstgewicht_kg || 99}" step="0.1" placeholder="${b.hoechstgewicht_kg || ""}">
      ` : ""}
      <button type="button" class="btn primary" data-abrechnen="${b.id}">Abrechnen</button>
      <span class="status-speichern" id="abrechnen-info-${b.id}" hidden></span>
    </div>`;
}

function listeRendern() {
  const liste = aktuellerFilter === "alle" ? bestellungen : bestellungen.filter(b => b.status === aktuellerFilter);

  if (!liste.length) {
    $("#bestell-liste").innerHTML = `<p class="leer">Keine Bestellungen in dieser Ansicht.</p>`;
    return;
  }

  $("#bestell-liste").innerHTML = `<div class="order-list">` + liste.map(b => `
    <article class="order" data-id="${b.id}">
      <div class="order-head">
        <h2>${esc(b.name || "Ohne Namen")}</h2>
        <span class="badge ${esc(b.status)}">${esc(statusLabel(b.status))}</span>
        <span class="badge ${b.bezahlt ? "bezahlt" : "nicht-bezahlt"}">${b.bezahlt ? "Abgerechnet" : "Nicht abgerechnet"}</span>
      </div>
      <p class="order-erstellt">Bestellt am ${zeitpunktFmt(b.created_at)}</p>

      <div class="order-grid">
        <div>
          <h3>Adresse</h3>
          <p>${esc(b.strasse || "")}${b.zusatz ? ", " + esc(b.zusatz) : ""}</p>
          <p>${esc(b.plz || "")} ${esc(b.ort || "")}</p>
          <p>Tel: ${esc(b.telefon || "–")}</p>
          ${b.email ? `<p>${esc(b.email)}</p>` : ""}
        </div>
        <div>
          <h3>Termine</h3>
          <p>Abholung: ${b.abholdatum ? datumFmt(b.abholdatum) : "–"}, ${esc(b.zeit_abholung || "–")}</p>
          <p>Rückgabe: ${esc(b.zeit_rueckgabe || "–")}</p>
        </div>
        <div>
          <h3>Sackwäsche</h3>
          ${saeckeText(b) || "<p>–</p>"}
          ${b.hoechstgewicht_kg ? `<p>Höchstgewicht: ${b.hoechstgewicht_kg} kg</p>` : ""}
        </div>
        <div>
          <h3>Spezialwäsche</h3>
          ${spezialText(b) || "<p>–</p>"}
        </div>
        <div>
          <h3>Preis</h3>
          <p class="preis">${eur(b.hoechstbetrag_cent)} <span style="font-weight:400;color:var(--muted)">Höchstbetrag</span></p>
          ${b.rabatt_cent ? `<p>davon Rabatt: -${eur(b.rabatt_cent)}</p>` : ""}
          ${b.bezahlt ? `<p>Abgerechnet: ${eur(b.abgerechneter_betrag_cent)}${b.tatsaechliches_gewicht_kg != null ? ` bei ${b.tatsaechliches_gewicht_kg} kg` : ""}</p>` : ""}
        </div>
        ${b.hinweise ? `<div><h3>Hinweise</h3><p>${esc(b.hinweise)}</p></div>` : ""}
        ${b.foto_url ? `<div><h3>Foto</h3><a class="foto-link" href="${esc(b.foto_url)}" target="_blank" rel="noopener"><img src="${esc(b.foto_url)}" alt="Foto zur Bestellung von ${esc(b.name || "")}"></a></div>` : ""}
      </div>

      <div class="status-zeile">
        <label for="status-${b.id}" style="margin:0">Status</label>
        <select id="status-${b.id}" data-id="${b.id}">
          ${STATUS.map(s => `<option value="${s.id}" ${s.id === b.status ? "selected" : ""}>${esc(s.label)}</option>`).join("")}
        </select>
        <span class="status-speichern" id="status-info-${b.id}" hidden></span>
      </div>

      ${abrechnungHtml(b)}
    </article>`).join("") + `</div>`;

  $("#bestell-liste").querySelectorAll("select[data-id]").forEach(sel => {
    sel.addEventListener("change", async () => {
      const id = sel.dataset.id;
      const info = $("#status-info-" + id);
      sel.disabled = true;
      info.textContent = "Speichert …";
      info.hidden = false;

      const { error } = await sb.from("bestellungen").update({ status: sel.value }).eq("id", id);

      sel.disabled = false;
      if (error) {
        info.textContent = "Fehler beim Speichern.";
        return;
      }
      const b = bestellungen.find(x => x.id === id);
      if (b) b.status = sel.value;
      info.textContent = "Gespeichert.";
      setTimeout(() => { info.hidden = true; }, 2000);
      filterAnzeigen();
    });
  });

  $("#bestell-liste").querySelectorAll("[data-abrechnen]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.abrechnen;
      const b = bestellungen.find(x => x.id === id);
      const info = $("#abrechnen-info-" + id);
      if (!b) return;

      const hatSack = Array.isArray(b.saecke) && b.saecke.length > 0;
      let gewicht = null;
      if (hatSack) {
        const feld = $("#gewicht-" + id);
        gewicht = parseFloat((feld.value || "").replace(",", "."));
        if (!gewicht || gewicht <= 0) {
          info.textContent = "Bitte ein Gewicht über 0 kg eintragen.";
          info.hidden = false;
          return;
        }
      }

      const betrag = betragBerechnen(b, gewicht || 0);

      btn.disabled = true;
      info.textContent = "Wird abgerechnet …";
      info.hidden = false;

      const { data, error } = await sb.functions.invoke("capture-payment", {
        body: { bestellung_id: id, tatsaechliches_gewicht_kg: gewicht, betrag_cent: betrag }
      });

      if (error || !data || data.error) {
        info.textContent = "Fehler: " + (data && data.error ? data.error : (error ? error.message : "unbekannt"));
        btn.disabled = false;
        return;
      }

      b.bezahlt = true;
      b.abgerechneter_betrag_cent = betrag;
      b.tatsaechliches_gewicht_kg = gewicht;
      listeRendern();
    });
  });
}

/* ---------- Start ---------- */
initLogin();
sb.auth.onAuthStateChange((_event, session) => anmeldungAendern(session));
</script>
</body>
</html>
